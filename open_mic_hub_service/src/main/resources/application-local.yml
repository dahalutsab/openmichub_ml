server:
  port: 8181
  address: 0.0.0.0
  host: http://localhost
  base-url: ${server.host}:${server.port}/

spring:
  application:
    name: open mic hub
  servlet:
    multipart:
      max-file-size: 80MB
      max-request-size: 800MB

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/open_mic_hub}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver


  flyway:
    enabled: true
    locations: classpath:db/migration
    # Lets an existing database — one whose schema Hibernate had been building —
    # adopt migrations without re-running the baseline over live tables. Flyway
    # stamps it at V1 and applies only what comes after.
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "Schema as generated by Hibernate ddl-auto"
    validate-on-migrate: true

  jpa:
    show_sql: false
    hibernate:
      # The schema is owned by the migration files. Hibernate only checks that
      # its entity mappings still match what is there, and fails fast if an
      # entity has drifted from the migrations.
      ddl-auto: validate
    open-in-view: false
    properties:
      dialect: org.hibernate.dialect.PostgreSQLDialect


jwt:
  # Overridable so a container can point at a mounted volume instead of the packaged classpath.
  rsa-private-key: ${JWT_PRIVATE_KEY:classpath:certs/private_key.pem}
  rsa-public-key: ${JWT_PUBLIC_KEY:classpath:certs/public_key.pem}

app:
  # Single configurable upload root; defaults to ./uploads next to the app.
  filepath: ${UPLOAD_DIR:./uploads}

frontend:
  port: 4200
  domain: ${server.host}:${frontend.port}
  forgot_password: /auth/reset-password
  verify_email: /auth/verify-email
  # Where the browser lands after a social sign-in, carrying the token in the URL fragment.
  oauth_redirect: /auth/social

# Social sign-in. Blank means off: a provider is registered only when both of its values are
# present, and with neither set the feature does not exist and the application boots unchanged.
#
# These are deliberately not `spring.security.oauth2.client.registration.*`. Spring Boot validates
# that namespace eagerly and refuses to start on an empty client id, so declaring the providers
# there with blank defaults would make the credentials mandatory rather than optional.
#
# Redirect URI to register with each provider:
#   http://localhost:8181/login/oauth2/code/google
#   http://localhost:8181/login/oauth2/code/facebook
oauth:
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
  facebook:
    client-id: ${FACEBOOK_CLIENT_ID:}
    client-secret: ${FACEBOOK_CLIENT_SECRET:}

otp:
  expiryInSeconds: 300 # OTP expiry time in seconds (5 minutes)

# Mail Configuration
google:
  email: ${MAIL_USERNAME:}
  password: ${MAIL_PASSWORD:}

springdoc:
  api-docs:
    path: /v1/api-docs
    enabled: true
  swagger-ui:
    path: /v1/swagger

cors:
  # Comma-separated. Add your deployed frontend origin here per environment.
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

khalti:
  # Sandbox by default. Production: https://khalti.com/api/v2
  base-url: ${KHALTI_BASE_URL:https://dev.khalti.com/api/v2}
  secret-key: ${KHALTI_SECRET_KEY:}

ml:
  service:
    # The discovery endpoints degrade to a plain listing when this is unreachable.
    url: ${ML_SERVICE_URL:http://localhost:8000}
    timeout-ms: ${ML_SERVICE_TIMEOUT_MS:4000}

chatbot:
  api-key: ${CHATBOT_API_KEY:}

admin:
  email: ${ADMIN_EMAIL:admin@openmichub.com}
  password: ${ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        # Health only. Nothing else is exposed.
        include: health
  endpoint:
    health:
      show-details: never
