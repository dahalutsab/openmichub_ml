server:
  port: 8181
  address: 0.0.0.0
  host: http://localhost
  base-url: ${server.host}:${server.port}/

spring:
  application:
    name: open mic hub
  servlet:
    multipart:
      max-file-size: 80MB
      max-request-size: 800MB

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/open_mic_hub}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver


  jpa:
    show_sql: true
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    properties:
      dialect: org.hibernate.dialect.PostgreSQLDialect


jwt:
  # Overridable so a container can point at a mounted volume instead of the packaged classpath.
  rsa-private-key: ${JWT_PRIVATE_KEY:classpath:certs/private_key.pem}
  rsa-public-key: ${JWT_PUBLIC_KEY:classpath:certs/public_key.pem}

app:
  # Single configurable upload root; defaults to ./uploads next to the app.
  filepath: ${UPLOAD_DIR:./uploads}

frontend:
  port: 4200
  domain: ${server.host}:${frontend.port}
  forgot_password: /auth/reset-password
  verify_email: /auth/verify-email

otp:
  expiryInSeconds: 300 # OTP expiry time in seconds (5 minutes)

# Mail Configuration
google:
  email: ${MAIL_USERNAME:}
  password: ${MAIL_PASSWORD:}

springdoc:
  api-docs:
    path: /v1/api-docs
    enabled: true
  swagger-ui:
    path: /v1/swagger

cors:
  # Comma-separated. Add your deployed frontend origin here per environment.
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

khalti:
  # Sandbox by default. Production: https://khalti.com/api/v2
  base-url: ${KHALTI_BASE_URL:https://dev.khalti.com/api/v2}
  secret-key: ${KHALTI_SECRET_KEY:}

chatbot:
  api-key: ${CHATBOT_API_KEY:}

admin:
  email: ${ADMIN_EMAIL:admin@openmichub.com}
  password: ${ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        # Health only. Nothing else is exposed.
        include: health
  endpoint:
    health:
      show-details: never
