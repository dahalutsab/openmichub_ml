<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenMicHUb Email Header</title>
</head>
<body style="margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif;">
<!-- HEADER COMPONENT -->
<table border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 600px; border-collapse: collapse; margin: 0 auto;">
    <tr>
        <td style="padding: 20px 0; background-color: #1a3a6e; text-align: center; border-top-left-radius: 6px; border-top-right-radius: 6px;" bgcolor="#1a3a6e">
            <!-- Circular Image Container -->
            <div style="display: inline-block; width: 90px; height: 90px; border-radius: 50%; background-color: #ffffff; padding: 5px; box-sizing: border-box;">
                <img src="https://i.postimg.cc/LYjRVwtQ/uchess.png"
                     alt="openmichub"
                     style="display: block; width: 100%; height: 100%; border-radius: 50%; object-fit: cover;">
            </div>
            <!-- Title -->
            <h1 style="margin: 10px 0 0; color: #ffffff; font-size: 28px; font-weight: bold; font-family: 'Georgia', serif; letter-spacing: 1px;">OpenMicHUb</h1>
        </td>
    </tr>
</table>
</body>
</html>
