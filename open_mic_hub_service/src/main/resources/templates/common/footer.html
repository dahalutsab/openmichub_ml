<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenMicHub Email Footer</title>
</head>
<body style="margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif;">
<!-- FOOTER COMPONENT -->
<table style="max-width: 600px; border-collapse: collapse; margin: 0 auto;">
    <tr>
        <td style="padding: 30px 40px; background-color: #f2f6fd; border-bottom-left-radius: 6px; border-bottom-right-radius: 6px; text-align: center;">
            <!-- Social media icons with inline SVG -->
            <table style="border-collapse: collapse; margin: 0 auto 20px;">
                <tr>
                    <!-- Facebook icon -->
                    <td style="text-align: center; padding: 0 10px;">
                        <a href="https://www.facebook.com/myself.utsab/" target="_blank" style="text-decoration: none; display: inline-block; width: 32px; height: 32px; border-radius: 50%; background-color: #1a3a6e; text-align: center; line-height: 32px;">
                            <img src="https://cdn2.iconfinder.com/data/icons/social-media-2285/512/1_Facebook_colored_svg_copy-1024.png" alt="facebook" style="width: 16px; height: 16px; vertical-align: middle;">
                        </a>
                    </td>

                    <!-- Twitter/X icon -->
                    <td style="text-align: center; padding: 0 10px;">
                        <a href="https://x.com/utsabdahal0" target="_blank" style="text-decoration: none; display: inline-block; width: 32px; height: 32px; border-radius: 50%; background-color: #1a3a6e; text-align: center; line-height: 32px;">
                            <img src="https://cdn2.iconfinder.com/data/icons/threads-by-instagram/24/x-logo-twitter-new-brand-contained-1024.png" alt="X" style="width: 16px; height: 16px; vertical-align: middle;">
                        </a>
                    </td>

                    <!-- Instagram icon -->
                    <td style="text-align: center; padding: 0 10px;">
                        <a href="https://www.instagram.com/myself.utsab/" target="_blank" style="text-decoration: none; display: inline-block; width: 32px; height: 32px; border-radius: 50%; background-color: #1a3a6e; text-align: center; line-height: 32px;">
                            <img src="https://cdn4.iconfinder.com/data/icons/logos-brands-7/512/instagram_icon-instagram_buttoninstegram-1024.png" alt="instagram" style="width: 16px; height: 16px; vertical-align: middle;">
                        </a>
                    </td>

                    <!-- LinkedIn icon -->
                    <td style="text-align: center; padding: 0 10px;">
                        <a href="https://www.linkedin.com/in/utsabdahal/" target="_blank" style="text-decoration: none; display: inline-block; width: 32px; height: 32px; border-radius: 50%; background-color: #1a3a6e; text-align: center; line-height: 32px;">
                            <img src="https://cdn1.iconfinder.com/data/icons/logotypes/32/circle-linkedin-1024.png" alt="linkedin" style="width: 16px; height: 16px; vertical-align: middle;">
                        </a>
                    </td>
                </tr>
            </table>

            <!-- Contact information -->
            <p style="margin: 0 0 10px; font-size: 14px; color: #666666;">
                <a href="mailto:info@dahalutsab.com.np" style="color: #1a3a6e; text-decoration: none; font-weight: bold;">info@dahalutsab.com.np</a>
            </p>

            <!-- Address if needed -->
            <p style="margin: 0 0 20px; font-size: 13px; color: #999999;">
                Kapan, Kathmandu, Nepal
            </p>

            <!-- Copyright and links -->
            <p style="margin: 0; font-size: 12px; color: #999999;">
                &copy; <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}"></span> OpenMicHub. All rights reserved.
            </p>

            <!-- Footer links -->
            <p style="margin: 10px 0 0; font-size: 12px; color: #999999;">
                <a href="openmichubnepal.com/privacy_policy" style="color: #1a3a6e; text-decoration: none; margin: 0 10px;">Privacy Policy</a>
                <a href="openmichubnepal.com/terms_of_service" style="color: #1a3a6e; text-decoration: none; margin: 0 10px;">Terms of Service</a>
                <a href="openmichubnepal.com/contact_us" style="color: #1a3a6e; text-decoration: none; margin: 0 10px;">Contact Us</a>" style="color: #1a3a6e; text-decoration: none; margin: 0 10px;">Unsubscribe</a>
            </p>
        </td>
    </tr>
</table>
</body>
</html>
