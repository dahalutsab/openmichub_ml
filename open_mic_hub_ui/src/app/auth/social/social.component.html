<div class="flex min-h-[60vh] items-center justify-center px-4">
  <div class="text-center">
    <ng-container *ngIf="!error">
      <div class="omh-spinner-lg mx-auto mb-4" role="status" aria-label="Signing you in"></div>
      <p class="text-base text-muted">Signing you in&hellip;</p>
    </ng-container>
    <p *ngIf="error" class="text-base text-critical">{{ error }}</p>
  </div>
</div>
