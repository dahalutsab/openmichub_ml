<div class="mx-auto w-full max-w-2xl px-4 py-10">
  <header class="mb-8 text-center">
    <h1 class="text-2xl font-semibold text-ink">One last thing</h1>
    <p class="mt-2 text-sm text-muted">What brings you to OpenMicHub?</p>
  </header>

  <div class="grid gap-4 sm:grid-cols-2">
    <button type="button" (click)="choose(false)"
            class="rounded-[12px] border-2 bg-white p-5 text-left transition"
            [ngClass]="performing === false ? 'border-accent' : 'border-gray-200 hover:border-gray-300'">
      <i class="bi bi-calendar-event mb-2 block text-2xl text-accent"></i>
      <span class="block font-medium text-ink">I'm booking artists</span>
      <span class="mt-1 block text-sm text-muted">Find performers and send booking requests.</span>
    </button>

    <button type="button" (click)="choose(true)"
            class="rounded-[12px] border-2 bg-white p-5 text-left transition"
            [ngClass]="performing === true ? 'border-accent' : 'border-gray-200 hover:border-gray-300'">
      <i class="bi bi-music-note-beamed mb-2 block text-2xl text-accent"></i>
      <span class="block font-medium text-ink">I'm performing</span>
      <span class="mt-1 block text-sm text-muted">Publish a profile and take bookings.</span>
    </button>
  </div>

  <!-- Only an artist needs the extra detail; an organizer is done as soon as they choose. -->
  <div *ngIf="performing === true" class="mt-8 space-y-5">
    <div class="omh-field">
      <label for="stageName" class="omh-label">Stage name <span class="text-red-500">*</span></label>
      <input id="stageName" type="text" class="omh-input" [(ngModel)]="stageName" name="stageName"
             placeholder="The name audiences know you by">
    </div>

    <div class="omh-field">
      <label for="bio" class="omh-label">Short bio</label>
      <textarea id="bio" rows="3" class="omh-input" [(ngModel)]="bio" name="bio"
                placeholder="A line or two about your act"></textarea>
    </div>

    <div class="grid gap-5 sm:grid-cols-2">
      <div class="omh-field">
        <label for="location" class="omh-label">Based in</label>
        <input id="location" type="text" class="omh-input" [(ngModel)]="location" name="location"
               placeholder="Kathmandu">
      </div>
      <div class="omh-field">
        <label for="hourlyRate" class="omh-label">Hourly rate (NPR)</label>
        <input id="hourlyRate" type="number" min="0" class="omh-input"
               [(ngModel)]="hourlyRate" name="hourlyRate" placeholder="3000">
        <p class="mt-1 text-xs text-muted">You can set this later.</p>
      </div>
    </div>

    <div class="omh-field">
      <label class="omh-label">What do you perform? <span class="text-red-500">*</span></label>
      <div class="space-y-4">
        <div *ngFor="let genre of genres">
          <p class="mb-2 text-sm font-medium text-ink-soft">{{ genre.name }}</p>
          <div class="flex flex-wrap gap-2">
            <button *ngFor="let sub of genre.categories" type="button"
                    (click)="toggleSubGenre(sub.id)"
                    class="rounded-full border px-3 py-1.5 text-sm transition"
                    [ngClass]="selectedSubGenres.has(sub.id)
                      ? 'border-accent bg-accent/10 text-accent'
                      : 'border-gray-300 bg-white text-ink-soft hover:border-gray-400'">
              {{ sub.name }}
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <button type="button" class="omh-btn-primary omh-btn-lg mt-8 w-full"
          [disabled]="!canSubmit" (click)="submit()">
    <span class="omh-spinner-sm" *ngIf="isSaving"></span>
    {{ isSaving ? 'Setting up…' : 'Continue' }}
  </button>
</div>
