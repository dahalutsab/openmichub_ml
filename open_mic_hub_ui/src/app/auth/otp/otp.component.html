<div class="otp-wrapper">
  <div class="otp-container">
    <div class="header-section">
      <h2 class="main-title">Verify Your Email</h2>
      <p class="subtitle">Enter the OTP sent to {{ email || 'your email' }}</p>
    </div>

    <form [formGroup]="otpForm" (ngSubmit)="onSubmit()" class="otp-form">
      <div class="form-group">
        <label for="otp" class="form-label">
          <span class="label-text">OTP</span>
          <span class="required-indicator">*</span>
        </label>
        <div class="input-container">
          <input
            id="otp"
            formControlName="otp"
            type="text"
            class="form-input"
            [class.error]="submitted && otpForm.get('otp')?.invalid"
            placeholder="Enter 6-digit OTP"
            maxlength="6"
            inputmode="numeric"
          />
          <div class="input-focus-border"></div>
        </div>
        <div *ngIf="submitted && otpForm.get('otp')?.invalid" class="error-message">
          <span class="error-icon">⚠️</span>
          Please enter a valid 6-digit OTP
        </div>
      </div>

      <div *ngIf="errorMessage" class="global-error-message">
        <span class="error-icon">❌</span>
        {{ errorMessage }}
      </div>

      <button
        type="submit"
        [disabled]="isSubmitting"
        class="submit-button"
        [class.loading]="isSubmitting"
      >
        <span class="button-content">
          <span *ngIf="isSubmitting" class="loading-spinner"></span>
          <span class="button-text">{{ isSubmitting ? 'Verifying...' : 'Verify OTP' }}</span>
        </span>
        <div class="button-shine"></div>
      </button>
    </form>
  </div>
</div>
