<!-- Icon rail. Always present from lg up. -->
<aside class="omh-rail" aria-label="Primary">

  <a [routerLink]="dashboardRoute" class="omh-rail-mark" aria-label="OpenMicHub">
    <i class="bi bi-soundwave"></i>
  </a>

  <nav class="flex flex-1 flex-col items-center gap-1">
    <a *ngFor="let item of railItems"
       [routerLink]="item.route"
       routerLinkActive="is-active"
       class="omh-rail-btn group"
       [attr.aria-label]="item.title.trim()">
      <i [ngClass]="item.icon"></i>
      <span class="omh-rail-tip">{{ item.title.trim() }}</span>
    </a>
  </nav>

  <!-- Drawer handle, so the labelled list is always one click away. -->
  <button type="button"
          class="omh-rail-btn group"
          [attr.aria-expanded]="layout.sidebarOpen()"
          aria-label="Open navigation"
          (click)="layout.toggleSidebar()">
    <i class="bi bi-list"></i>
    <span class="omh-rail-tip">All pages</span>
  </button>
</aside>

<!-- Scrim, only while the drawer is open. -->
<div class="omh-scrim" *ngIf="layout.sidebarOpen()" (click)="layout.closeSidebar()"></div>

<!-- Labelled drawer -->
<aside class="omh-drawer" [class.is-open]="layout.sidebarOpen()" aria-label="All pages">

  <div class="omh-drawer-head">
    <a [routerLink]="dashboardRoute"
       class="flex items-center gap-2 font-display text-md font-extrabold tracking-[-0.02em] text-ink"
       (click)="layout.closeSidebar()">
      <span class="flex h-7 w-7 items-center justify-center rounded-[8px] bg-accent text-accent-ink">
        <i class="bi bi-soundwave text-sm"></i>
      </span>
      OpenMicHub
    </a>
    <button type="button" class="omh-icon-btn" aria-label="Close navigation" (click)="layout.closeSidebar()">
      <i class="bi bi-x-lg"></i>
    </button>
  </div>

  <nav class="flex flex-1 flex-col gap-0.5 px-2 pb-6">
    <p class="omh-nav-section">Dashboard</p>

    <a [routerLink]="dashboardRoute"
       routerLinkActive="is-active"
       (click)="layout.closeSidebar()"
       class="omh-nav-link">
      <i class="bi bi-grid-1x2"></i>
      <span>Overview</span>
    </a>

    <p class="omh-nav-section">Manage</p>

    <ng-container *ngFor="let item of navigationItems">

      <a *ngIf="!item.children?.length"
         [routerLink]="item.route"
         routerLinkActive="is-active"
         (click)="layout.closeSidebar()"
         class="omh-nav-link">
        <i [ngClass]="item.icon"></i>
        <span>{{ item.title.trim() }}</span>
      </a>

      <div *ngIf="item.children?.length">
        <button type="button"
                class="omh-nav-link justify-between"
                [class.is-active]="item.expanded"
                [attr.aria-expanded]="item.expanded"
                (click)="toggleExpanded(item)">
          <span class="flex items-center gap-3">
            <i [ngClass]="item.icon"></i>
            <span>{{ item.title.trim() }}</span>
          </span>
          <i class="bi bi-chevron-down text-xs transition-transform duration-200"
             [class.rotate-180]="item.expanded"></i>
        </button>

        <div class="ml-4 mt-1 flex flex-col gap-0.5 border-l border-line pl-2" *ngIf="item.expanded">
          <a *ngFor="let child of item.children"
             [routerLink]="child.route"
             routerLinkActive="is-active"
             (click)="layout.closeSidebar()"
             class="omh-nav-link text-xs">
            <i [ngClass]="child.icon"></i>
            <span>{{ child.title.trim() }}</span>
          </a>
        </div>
      </div>

    </ng-container>
  </nav>
</aside>
