
<div class="d-flex" style="min-height: 150vh; 
  position: sticky; top: 0;">
  <!-- Sidebar -->
  <div class="d-flex flex-column p-3 text-white bg-dark" style="width: 280px; box-shadow: 2px 0 10px rgba(0,0,0,0.1);">
    <!-- Header -->
    <a href="/" class="d-flex align-items-center mb-4 text-white text-decoration-none">
      <span class="fs-4 fw-semibold">OpenMicHub Panel</span>
    </a>
    
    <hr class="border-secondary my-3">
    
    <!-- Navigation -->
    <ul class="nav nav-pills flex-column mb-auto gap-1">
      <li *ngFor="let item of navigationItems" class="mb-1">
        <!-- Navigation Item without children -->
        <ng-container *ngIf="!item.children || item.children.length === 0; else hasChildren">
          <a [routerLink]="item.route" class="nav-link text-light d-flex align-items-center rounded px-3 py-2 hover-highlight" 
             [routerLinkActive]="'active bg-primary'">
            <i class="bi me-3 fs-5" [ngClass]="item.icon"></i>
            <span>{{item.title}}</span>
          </a>
        </ng-container>
        
        <!-- Navigation Item with children -->
        <ng-template #hasChildren>
          <div class="mb-2">
            <a class="nav-link text-light d-flex align-items-center justify-content-between rounded px-3 py-2 hover-highlight" 
               (click)="toggleExpanded(item)"
               [class.active]="item.expanded">
              <span class="d-flex align-items-center">
                <i class="bi me-3 fs-5" [ngClass]="item.icon"></i>
                <span>{{item.title}}</span>
              </span>
              <i class="bi transition-icon" [ngClass]="item.expanded ? 'bi-chevron-up' : 'bi-chevron-down'"></i>
            </a>
            <div class="submenu-transition" [ngClass]="{'submenu-expanded': item.expanded}">
              <ul class="nav flex-column ms-4 mt-1" *ngIf="item.expanded">
                <li *ngFor="let child of item.children" class="mb-1">
                  <a [routerLink]="child.route" class="nav-link text-light-emphasis d-flex align-items-center rounded px-3 py-2 hover-highlight" 
                     [routerLinkActive]="'active bg-primary-subtle text-primary'">
                    <i class="bi me-2" [ngClass]="child.icon"></i>
                    <span class="smaller-text">{{child.title}}</span>
                  </a>
                </li>
              </ul>
            </div>
          </div>
        </ng-template>
      </li>
    </ul>
    
  </div>
</div>
