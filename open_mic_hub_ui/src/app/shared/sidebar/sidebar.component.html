<!-- Drawer scrim. Below lg the sidebar slides over the content, so it needs
     something to dismiss it against. -->
<div class="omh-scrim" *ngIf="layout.sidebarOpen()" (click)="layout.closeSidebar()"></div>

<aside class="omh-sidebar" [class.is-open]="layout.sidebarOpen()">

  <a routerLink="/" class="omh-sidebar-brand">
    <i class="bi bi-soundwave text-hot"></i>
    <span>OpenMicHub</span>
  </a>

  <nav class="flex flex-1 flex-col gap-0.5 px-3 pb-6" aria-label="Dashboard">
    <ng-container *ngFor="let item of navigationItems">

      <!-- Leaf item -->
      <a *ngIf="!item.children?.length"
         [routerLink]="item.route"
         routerLinkActive="is-active"
         (click)="layout.closeSidebar()"
         class="omh-sidebar-link">
        <i [ngClass]="item.icon"></i>
        <span>{{ item.title.trim() }}</span>
      </a>

      <!-- Group with children -->
      <div *ngIf="item.children?.length">
        <button type="button"
                class="omh-sidebar-link justify-between"
                [class.is-active]="item.expanded"
                [attr.aria-expanded]="item.expanded"
                (click)="toggleExpanded(item)">
          <span class="flex items-center gap-3">
            <i [ngClass]="item.icon"></i>
            <span>{{ item.title.trim() }}</span>
          </span>
          <i class="bi text-xs transition-transform duration-200"
             [class.bi-chevron-down]="true"
             [class.rotate-180]="item.expanded"></i>
        </button>

        <div class="omh-sidebar-sublist" *ngIf="item.expanded">
          <a *ngFor="let child of item.children"
             [routerLink]="child.route"
             routerLinkActive="is-active"
             (click)="layout.closeSidebar()"
             class="omh-sidebar-sublink">
            <i [ngClass]="child.icon"></i>
            <span>{{ child.title.trim() }}</span>
          </a>
        </div>
      </div>

    </ng-container>
  </nav>

</aside>
