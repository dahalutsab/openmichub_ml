<!-- post-list/post-list.component.html -->
<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Posts Management</h2>
    <button type="button" class="btn btn-primary" (click)="createPost()">
      <i class="fas fa-plus"></i> Create New Post
    </button>
  </div>

  <!-- Loading Spinner -->
  <div *ngIf="loading" class="text-center">
    <div class="spinner-border" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <!-- Posts Table -->
  <div *ngIf="!loading" class="card">
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-striped table-hover">
          <thead class="table-dark">
            <tr>
              <th>ID</th>
              <th>Title</th>
              <th>Content</th>
              <th>Images</th>
              <th>Likes</th>
              <th>Created At</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let post of posts">
              <td>{{ post.id }}</td>
              <td>{{ post.title }}</td>
              <td>{{ post.content | slice:0:50 }}{{ post.content.length > 50 ? '...' : '' }}</td>
              <td>
                <span class="badge bg-info">{{ post.images?.length || 0 }} images</span>
              </td>
              <td>
                <span class="badge bg-success">{{ post.likesCount }}</span>
              </td>
              <td>{{ post.createdAt | date:'short' }}</td>
              <td>
                <div class="btn-group" role="group">
                  <button type="button" class="btn btn-sm btn-outline-primary" 
                          (click)="viewPost(post.id!)" title="View">
                    <i class="bi bi-eye"></i>
                  </button>
                  <button type="button" class="btn btn-sm btn-outline-warning" 
                          (click)="editPost(post.id!)" title="Edit">
                    <i class="bi bi-pencil"></i>
                  </button>
                  <button type="button" class="btn btn-sm btn-outline-danger" 
                          (click)="deletePost(post.id!)" title="Delete">
                    <i class="bi bi-trash"></i>
                  </button>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Pagination -->
      <nav *ngIf="totalPages > 1" aria-label="Posts pagination">
        <ul class="pagination justify-content-center">
          <li class="page-item" [class.disabled]="currentPage === 0">
            <button class="page-link" (click)="onPageChange(currentPage - 1)" 
                    [disabled]="currentPage === 0">Previous</button>
          </li>
          <li *ngFor="let page of [].constructor(totalPages); let i = index" 
              class="page-item" [class.active]="i === currentPage">
            <button class="page-link" (click)="onPageChange(i)">{{ i + 1 }}</button>
          </li>
          <li class="page-item" [class.disabled]="currentPage === totalPages - 1">
            <button class="page-link" (click)="onPageChange(currentPage + 1)" 
                    [disabled]="currentPage === totalPages - 1">Next</button>
          </li>
        </ul>
      </nav>

      <!-- No Posts Message -->
      <div *ngIf="posts.length === 0" class="text-center py-4">
        <p class="text-muted">No posts found.</p>
      </div>
    </div>
  </div>
</div>
