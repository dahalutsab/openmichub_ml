<div class="omh-page-head">
  <div>
    <h1 class="omh-page-title">New post</h1>
    <p class="omh-page-sub">Share a clip, a photo or a note with the people following you.</p>
  </div>
</div>

<form [formGroup]="postForm" (ngSubmit)="onSubmit()" class="max-w-3xl">
  <section class="omh-panel">
    <div class="omh-panel-body flex flex-col gap-5">

      <div class="omh-field">
        <label for="title" class="omh-label">Title <span class="text-hot">*</span></label>
        <input type="text"
               id="title"
               class="omh-input"
               formControlName="title"
               placeholder="What's this about?">
        <div class="omh-error" *ngIf="title?.invalid && title?.touched">
          <span *ngIf="title?.errors?.['required']">A title is required.</span>
          <span *ngIf="title?.errors?.['minlength']">Use at least 3 characters.</span>
        </div>
      </div>

      <div class="omh-field">
        <label for="content" class="omh-label">Content <span class="text-hot">*</span></label>
        <textarea id="content"
                  rows="6"
                  class="omh-textarea"
                  formControlName="content"
                  placeholder="Tell people what happened…"></textarea>
        <div class="omh-error" *ngIf="content?.invalid && content?.touched">
          <span *ngIf="content?.errors?.['required']">Content is required.</span>
          <span *ngIf="content?.errors?.['minlength']">Use at least 10 characters.</span>
        </div>
      </div>

      <div class="omh-field">
        <label for="images" class="omh-label">Images</label>

        <!-- The native file input is unstyleable across browsers, so it is
             visually hidden and the label becomes the control. -->
        <label for="images"
               class="flex cursor-pointer flex-col items-center justify-center gap-2
                      rounded-card border border-dashed border-line bg-surface-2/50
                      px-6 py-8 text-center hover:border-muted">
          <i class="bi bi-cloud-arrow-up text-2xl text-muted"></i>
          <span class="font-display text-sm font-semibold text-ink">Choose images</span>
          <span class="text-xs text-muted">PNG or JPG, as many as you like</span>
        </label>
        <input type="file"
               id="images"
               class="sr-only"
               multiple
               accept="image/*"
               (change)="onFileSelect($event)">
      </div>

      <!-- Previews -->
      <div *ngIf="imagePreviews.length">
        <p class="omh-label">Selected ({{ imagePreviews.length }})</p>
        <div class="grid grid-cols-2 gap-3 sm:grid-cols-3 lg:grid-cols-4">
          <div *ngFor="let preview of imagePreviews; let i = index" class="group relative">
            <img [src]="preview"
                 alt=""
                 class="h-32 w-full rounded-card border border-line object-cover">
            <button type="button"
                    class="absolute right-1.5 top-1.5 flex h-7 w-7 items-center justify-center
                           rounded-full border-0 bg-stage-ink/75 text-white cursor-pointer
                           opacity-0 transition-opacity group-hover:opacity-100 focus:opacity-100"
                    aria-label="Remove image"
                    (click)="removeImage(i)">
              <i class="bi bi-x-lg text-xs"></i>
            </button>
          </div>
        </div>
      </div>

    </div>

    <div class="omh-modal-foot">
      <button type="button" class="omh-btn-secondary" (click)="cancel()" [disabled]="loading">
        Cancel
      </button>
      <button type="submit" class="omh-btn-primary" [disabled]="loading">
        <span class="omh-spinner-sm" *ngIf="loading"></span>
        {{ loading ? 'Publishing…' : 'Publish post' }}
      </button>
    </div>
  </section>
</form>
