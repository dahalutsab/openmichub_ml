<header class="omh-topbar">

  <button type="button"
          class="omh-btn-icon lg:hidden"
          aria-label="Toggle navigation"
          (click)="layout.toggleSidebar()">
    <i class="bi bi-list text-xl"></i>
  </button>

  <div class="flex-1"></div>

  <!-- Balance, read straight from the topbar on wide screens so an artist never
       has to open the menu to see it. -->
  <div class="mr-1 hidden text-right sm:block">
    <div class="omh-stat-label">Balance</div>
    <div class="omh-figure text-md">NPR {{ userBalance }}</div>
  </div>

  <div class="relative" (omhClickOutside)="menuOpen = false">
    <button type="button"
            class="flex items-center gap-2 rounded-card border-0 bg-transparent px-2 py-1.5 cursor-pointer hover:bg-surface-2"
            [attr.aria-expanded]="menuOpen"
            aria-haspopup="menu"
            (click)="menuOpen = !menuOpen">
      <span class="relative inline-flex">
        <img [src]="userProfile.avatar" alt="" class="omh-avatar-sm">
        <span class="absolute -bottom-0.5 -right-0.5 h-2.5 w-2.5 rounded-full border-2 border-surface bg-positive"></span>
      </span>
      <i class="bi bi-chevron-down text-xs text-muted transition-transform duration-200"
         [class.rotate-180]="menuOpen"></i>
    </button>

    <div class="omh-menu right-0 top-full mt-1.5 w-[264px] animate-menu-in" *ngIf="menuOpen" role="menu">

      <div class="omh-menu-head flex items-center gap-3">
        <img [src]="userProfile.avatar" alt="" class="omh-avatar-md">
        <div class="min-w-0">
          <div class="truncate font-display text-base font-bold text-ink">{{ userProfile.name }}</div>
          <span class="omh-status-positive mt-1">Active</span>
        </div>
      </div>

      <div class="my-1 rounded-card bg-surface-2 px-3 py-2.5">
        <div class="omh-stat-label">Wallet balance</div>
        <div class="omh-figure mt-0.5 text-xl">NPR {{ userBalance }}</div>
      </div>

      <button type="button" class="omh-menu-item" role="menuitem" (click)="viewProfile()">
        <i class="bi bi-person-circle"></i>
        <span>View profile</span>
      </button>
      <button type="button" class="omh-menu-item" role="menuitem" (click)="goToWallet()">
        <i class="bi bi-wallet2"></i>
        <span>Wallet</span>
      </button>

      <div class="omh-menu-divider"></div>

      <button type="button" class="omh-menu-item is-danger" role="menuitem" (click)="logout()">
        <i class="bi bi-box-arrow-right"></i>
        <span>Logout</span>
      </button>
    </div>
  </div>

</header>
