<!-- `omh-app` scopes the dashboard's own theme tokens. Everything inside it
     re-themes with the light/dark toggle; the marketing pages outside it keep
     the palette they were designed in. -->
<div class="omh-app omh-shell">

  <app-sidebar></app-sidebar>

  <div class="omh-main">
    <app-header></app-header>

    <main class="omh-content">
      <router-outlet></router-outlet>
    </main>

    <footer class="omh-footer">
      &copy; OpenMicHub {{ currentYear }}
    </footer>
  </div>

</div>
