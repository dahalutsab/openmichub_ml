<div class="container mt-4">
      <div class="row justify-content-center">
        <div class="col-lg-12 col-md-10">
          <div class="card shadow">
            <div class="card-header bg-primary text-white">
              <h4 class="mb-0">
                <i class="fas fa-user me-2"></i>User Profile
              </h4>
            </div>
            
            <div class="card-body" *ngIf="user">
              <div class="row">
                <!-- Profile Picture Section -->
                <div class="col-md-4 text-center mb-4">
                  <div class="position-relative d-inline-block">
                    <img 
                      [src]="user.profilePicture" 
                      [alt]="user.fullName"
                      class="rounded-circle img-fluid profile-img shadow"
                      style="width: 150px; height: 150px; object-fit: cover;"
                      (error)="onImageError($event)">
                  </div>
                  
                  <!-- Role Badges -->
                  <div class="mt-3">
                    <span 
                      *ngFor="let role of user.userRole" 
                      class="badge bg-success me-1 mb-1 px-3 py-2">
                      {{ role.role }}
                    </span>
                  </div>
                </div>
                
                <!-- User Details Section -->
                <div class="col-md-8">
                  <div class="row g-3">
                    <!-- Full Name -->
                    <div class="col-12">
                      <div class="border rounded p-3 bg-light">
                        <label class="form-label text-muted small mb-1">Full Name</label>
                        <div class="fw-bold">{{ user.fullName }}</div>
                      </div>
                    </div>
                    
                    <!-- Email -->
                    <div class="col-12">
                      <div class="border rounded p-3 bg-light">
                        <label class="form-label text-muted small mb-1">Email Address</label>
                        <div class="fw-bold">
                          <i class="fas fa-envelope me-2 text-primary"></i>
                          {{ user.userEmail }}
                        </div>
                      </div>
                    </div>
                    
                    <!-- Phone Number -->
                    <div class="col-md-12">
                      <div class="border rounded p-3 bg-light">
                        <label class="form-label text-muted small mb-1">Phone Number</label>
                        <div class="fw-bold">
                          <i class="fas fa-phone me-2 text-success"></i>
                          {{ user.phoneNumber }}
                        </div>
                      </div>
                    </div>
                    
                    <!-- Location -->
                    <div class="col-12">
                      <div class="border rounded p-3 bg-light">
                        <label class="form-label text-muted small mb-1">Location</label>
                        <div class="fw-bold">
                          <i class="fas fa-map-marker-alt me-2 text-danger"></i>
                          {{ user.location }}
                        </div>
                      </div>
                    </div>
                    
                    <!-- Role Descriptions -->
                    <div class="col-12" *ngIf="user.userRole.length > 0">
                      <div class="border rounded p-3 bg-light">
                        <label class="form-label text-muted small mb-2">Role Information</label>
                        <div *ngFor="let role of user.userRole" class="mb-2">
                          <div class="d-flex align-items-center">
                            <span class="badge bg-primary me-2">{{ role.role }}</span>
                            <span class="text-muted">{{ role.description }}</span>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            
            <!-- Loading State -->
            <div class="card-body text-center" *ngIf="loading">
              <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
              </div>
              <p class="mt-2 text-muted">Loading profile...</p>
            </div>
            
            <!-- Error State -->
            <div class="card-body" *ngIf="error">
              <div class="alert alert-danger d-flex align-items-center" role="alert">
                <i class="fas fa-exclamation-triangle me-2"></i>
                <div>{{ error }}</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
