<header class="omh-topbar">

  <button type="button"
          class="omh-icon-btn lg:hidden"
          aria-label="Open navigation"
          (click)="layout.toggleSidebar()">
    <i class="bi bi-list"></i>
  </button>

  <label class="omh-search">
    <i class="bi bi-search shrink-0 text-sm text-muted"></i>
    <input type="search"
           name="q"
           placeholder="Search artists…"
           [(ngModel)]="query"
           (keyup.enter)="search()"
           aria-label="Search artists">
  </label>

  <div class="flex-1"></div>

  <a routerLink="/discover" class="omh-btn-primary omh-btn-sm hidden sm:inline-flex">
    <i class="bi bi-stars"></i> Discover
  </a>

  <button type="button"
          class="omh-icon-btn"
          [attr.aria-label]="'Theme: ' + theme.label"
          [title]="'Theme: ' + theme.label"
          (click)="theme.toggle()">
    <i class="bi" [ngClass]="theme.icon"></i>
  </button>

  <button type="button" class="omh-icon-btn" aria-label="Notifications">
    <i class="bi bi-bell"></i>
  </button>

  <div class="relative" (omhClickOutside)="menuOpen = false">
    <button type="button"
            class="flex items-center gap-2 rounded-[10px] border border-line bg-surface px-2 py-1.5 cursor-pointer hover:bg-surface-2"
            [attr.aria-expanded]="menuOpen"
            aria-haspopup="menu"
            (click)="menuOpen = !menuOpen">
      <img [src]="userProfile.avatar" alt="" class="omh-avatar-xs">
      <span class="hidden max-w-[120px] text-left sm:block">
        <span class="block truncate font-display text-xs font-bold leading-tight text-ink">
          {{ userProfile.name }}
        </span>
        <span class="block text-micro leading-tight text-muted">Booker</span>
      </span>
      <i class="bi bi-chevron-down text-xs text-muted transition-transform duration-200"
         [class.rotate-180]="menuOpen"></i>
    </button>

    <div class="omh-menu right-0 top-full mt-1.5 animate-menu-in" *ngIf="menuOpen" role="menu">
      <a class="omh-menu-item"
         role="menuitem"
         *ngIf="loggedInUserId"
         [routerLink]="['/user/profile', loggedInUserId]"
         (click)="menuOpen = false">
        <i class="bi bi-person-circle"></i>
        <span>Profile</span>
      </a>
      <a class="omh-menu-item" role="menuitem" routerLink="/user/bookings" (click)="menuOpen = false">
        <i class="bi bi-journal-bookmark"></i>
        <span>My bookings</span>
      </a>
      <button type="button" class="omh-menu-item" role="menuitem" (click)="theme.toggle()">
        <i class="bi" [ngClass]="theme.icon"></i>
        <span>Theme: {{ theme.label }}</span>
      </button>
      <div class="omh-menu-divider"></div>
      <button type="button" class="omh-menu-item is-danger" role="menuitem" (click)="logout()">
        <i class="bi bi-box-arrow-right"></i>
        <span>Logout</span>
      </button>
    </div>
  </div>

</header>
