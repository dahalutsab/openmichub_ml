<header class="omh-topbar">

  <button type="button"
          class="omh-btn-icon lg:hidden"
          aria-label="Toggle navigation"
          (click)="layout.toggleSidebar()">
    <i class="bi bi-list text-xl"></i>
  </button>

  <div class="flex-1"></div>

  <div class="relative" (omhClickOutside)="menuOpen = false">
    <button type="button"
            class="flex items-center gap-2.5 rounded-card border-0 bg-transparent px-2 py-1.5 cursor-pointer hover:bg-surface-2"
            [attr.aria-expanded]="menuOpen"
            aria-haspopup="menu"
            (click)="menuOpen = !menuOpen">
      <span class="hidden max-w-[160px] truncate text-sm font-medium text-ink-soft sm:block">
        {{ userProfile.name }}
      </span>
      <img [src]="userProfile.avatar" alt="" class="omh-avatar-sm">
      <i class="bi bi-chevron-down text-xs text-muted transition-transform duration-200"
         [class.rotate-180]="menuOpen"></i>
    </button>

    <div class="omh-menu right-0 top-full mt-1.5 animate-menu-in" *ngIf="menuOpen" role="menu">
      <a class="omh-menu-item"
         role="menuitem"
         *ngIf="loggedInUserId"
         [routerLink]="['/user/profile', loggedInUserId]"
         (click)="menuOpen = false">
        <i class="bi bi-person-circle"></i>
        <span>Profile</span>
      </a>
      <div class="omh-menu-divider"></div>
      <button type="button" class="omh-menu-item is-danger" role="menuitem" (click)="logout()">
        <i class="bi bi-box-arrow-right"></i>
        <span>Logout</span>
      </button>
    </div>
  </div>

</header>
