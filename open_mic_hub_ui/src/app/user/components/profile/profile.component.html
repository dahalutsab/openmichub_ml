<div *ngIf="isLoading">Loading profile...</div>

<div *ngIf="!isLoading && userData" class="card p-4 shadow">
  <div class="d-flex align-items-center">
    <img
      [src]="userData.profilePicture || 'assets/profile.jpg'"
      alt="Profile"
      class="rounded-circle me-3"
      width="100"
      height="100"
    />
    <div>
      <h4 class="mb-1">{{ userData.fullName }}</h4>
      <p class="mb-0 text-muted">{{ userData.userEmail }}</p>

      
    </div>
  </div>
  <hr />
  <p><strong>Phone:</strong> {{ userData.phoneNumber || 'N/A' }}</p>
  <p><strong>Location:</strong> {{ userData.location || 'N/A' }}</p>
</div>
