<header class="omh-topbar">

  <!-- Below lg the rail is hidden, so the drawer needs its own handle here. -->
  <button type="button"
          class="omh-icon-btn lg:hidden"
          aria-label="Open navigation"
          (click)="layout.toggleSidebar()">
    <i class="bi bi-list"></i>
  </button>

  <label class="omh-search">
    <i class="bi bi-search shrink-0 text-sm text-muted"></i>
    <input type="search"
           name="q"
           placeholder="Search users, bookings, payments…"
           [(ngModel)]="query"
           (keyup.enter)="search()"
           aria-label="Search">
    <kbd class="hidden shrink-0 rounded-[4px] border border-line px-1.5 py-0.5 font-sans text-micro text-muted sm:block">
      &#8629;
    </kbd>
  </label>

  <div class="flex-1"></div>

  <button type="button"
          class="omh-icon-btn"
          [attr.aria-label]="'Theme: ' + theme.label"
          [title]="'Theme: ' + theme.label"
          (click)="theme.toggle()">
    <i class="bi" [ngClass]="theme.icon"></i>
  </button>

  <button type="button" class="omh-icon-btn" aria-label="Notifications">
    <i class="bi bi-bell"></i>
    <span class="omh-dot"></span>
  </button>

  <div class="relative" (omhClickOutside)="menuOpen = false">
    <button type="button"
            class="flex items-center gap-2 rounded-[10px] border border-line bg-surface px-2 py-1.5 cursor-pointer hover:bg-surface-2"
            [attr.aria-expanded]="menuOpen"
            aria-haspopup="menu"
            (click)="menuOpen = !menuOpen">
      <img src="assets/profile.jpg" alt="" class="omh-avatar-xs">
      <span class="hidden text-left sm:block">
        <span class="block font-display text-xs font-bold leading-tight text-ink">Admin</span>
        <span class="block text-micro leading-tight text-muted">Platform staff</span>
      </span>
      <i class="bi bi-chevron-down text-xs text-muted transition-transform duration-200"
         [class.rotate-180]="menuOpen"></i>
    </button>

    <div class="omh-menu right-0 top-full mt-1.5 animate-menu-in" *ngIf="menuOpen" role="menu">
      <button type="button" class="omh-menu-item" role="menuitem" (click)="viewProfile()">
        <i class="bi bi-person-circle"></i>
        <span>Profile</span>
      </button>
      <button type="button" class="omh-menu-item" role="menuitem" (click)="theme.toggle()">
        <i class="bi" [ngClass]="theme.icon"></i>
        <span>Theme: {{ theme.label }}</span>
      </button>
      <div class="omh-menu-divider"></div>
      <button type="button" class="omh-menu-item is-danger" role="menuitem" (click)="logout()">
        <i class="bi bi-box-arrow-right"></i>
        <span>Logout</span>
      </button>
    </div>
  </div>

</header>
