services:
  postgres:
    image: postgres:16-alpine
    container_name: openmichub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: open_mic_hub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - openmichub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d open_mic_hub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  openmichub_pgdata:
